document.querySelectorAll('.image-wrap').forEach(function(wrap) {
  var tooltip = wrap.querySelector('.wrap-comment');
  var timer;
  var lastX, lastY;
  function showTooltip() {
    var rect = wrap.getBoundingClientRect();
    var x = lastX - rect.left;
    var y = lastY - rect.top;
    tooltip.style.left = x + 'px';
    tooltip.style.top  = (y - tooltip.offsetHeight) + 'px';
    tooltip.style.opacity = '1';
  }
  wrap.addEventListener('mousemove', function(e) {
    lastX = e.clientX;
    lastY = e.clientY;
  });
  wrap.addEventListener('mouseenter', function() {
    timer = setTimeout(showTooltip, 200);
  });
  wrap.addEventListener('mouseleave', function() {
    clearTimeout(timer);
    tooltip.style.opacity = '0';
  });
});
</script>
